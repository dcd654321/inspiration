schema: spec-driven

context: |
  Language: zh-CN. 正文使用中文，保留 OpenSpec 结构标题及 SHALL/MUST。
  项目：灵感拾光簿，原生微信小程序，JavaScript/WXML/WXSS，微信云开发。
  用户是业余时间开发的个人程序员，优先小范围、可验收、低维护成本的改动。
  当前仅完成工程初始化骨架；四项核心能力中的三项（记录补充、拍照上传、AI 扩展）尚未实现，热度提炼已于 2026-09-22 决定暂缓，留待后续独立变更。
  仅 dev 开发，用户测试确认且明确要求后才能合并到 main。
  现状以代码和验证证据为准；未实现的行为不得写成已实现事实。
  云环境与 AI 默认关闭（config/cloud.js、config/ai.js 的 enabled 均为 false）。
  新资源前缀 linggan_；不擅自改其他小程序或共用认证资源。
  拍照上传的图片属用户个人内容，删除灵感时须同步清理云存储文件。
  AI 输出必须经 core/ai-contract.js 校验后才可展示或写入，AI 不可用时基础记录必须可用。
  常规验证 npm test / npm run check；规范校验 npm run openspec -- validate --all --strict。
  不记录密钥、原始账户身份、生产用户数据及用户照片地址。详细约定见根目录 AGENTS.md。

rules:
  proposal:
    - 简述目标、非目标、影响范围及可观察的验收结果，区分现状与拟新增行为。
  specs:
    - 每项需求配可执行场景，涉及数据、身份和照片时覆盖隔离、失败与恢复。
  design:
    - 涉及云端时说明资源范围、部署授权、回滚策略及不得自动迁移的数据。
    - 涉及 AI 时说明模型来源、额度、内容安全、输出校验与降级路径。
  tasks:
    - 每项任务写验证方法，尽量可在一次工作时段内完成。
    - 实施、自动测试、云端验证和用户验收分别列项，未执行不得勾选。

operations:
  apply:
    guidance:
      - 用户授权实施后才开始，部署、AI 启用、删除和共用资源修改仍需独立核对授权。
  archive:
    guidance:
      - 用户验收前不归档为完成，归档不授予 main 合并或发布权限。
